<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Record · cn-intel-board</title>
  <meta name="description" content="中国硬科技供应链信息差信号看板——验证记录资产层。每条信号含预测日期、验证节点、结果记录。">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #a371f7;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); line-height: 1.6; }
    .container { max-width: 900px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-size: 1.8em; margin-bottom: 8px; }
    .subtitle { color: var(--muted); margin-bottom: 32px; }
    .summary-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 16px; margin-bottom: 40px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 20px; text-align: center; }
    .stat-value { font-size: 2.2em; font-weight: 700; color: var(--accent); }
    .stat-label { font-size: 0.85em; color: var(--muted); margin-top: 4px; }
    .section { margin-bottom: 40px; }
    .section-title { font-size: 1.1em; color: var(--muted); margin-bottom: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--border); }
    table { width: 100%; border-collapse: collapse; font-size: 0.9em; }
    th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: 0.8em; text-transform: uppercase; letter-spacing: 0.5px; }
    tr:hover { background: var(--surface); }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 0.8em; font-weight: 600; }
    .badge-pending { background: rgba(88,166,255,0.15); color: var(--accent); }
    .badge-hit { background: rgba(63,185,80,0.15); color: var(--green); }
    .badge-miss { background: rgba(248,81,73,0.15); color: var(--red); }
    .badge-industry { background: rgba(163,113,247,0.15); color: var(--purple); }
    .empty-state { color: var(--muted); padding: 40px; text-align: center; }
    .footer { color: var(--muted); font-size: 0.85em; margin-top: 60px; padding-top: 20px; border-top: 1px solid var(--border); }
    .footer a { color: var(--accent); text-decoration: none; }
    .disclaimer { background: rgba(210,153,34,0.1); border: 1px solid rgba(210,153,34,0.3); border-radius: 8px; padding: 16px; margin-bottom: 32px; font-size: 0.85em; color: var(--muted); }
  </style>
</head>
<body>
  <div class="container">
    <h1>📊 Track Record</h1>
    <p class="subtitle">中国硬科技供应链信息差 · 验证记录资产层</p>

    <div class="disclaimer">
      ⚠️ 免责声明：本页面仅供参考，不构成任何投资建议。信号来源于公开信息分析，结果记录存在时滞。过往准确率不代表未来表现。
    </div>

    <div class="summary-grid" id="summaryGrid">
      <div class="stat-card"><div class="stat-value" id="totalSignals">—</div><div class="stat-label">总信号数</div></div>
      <div class="stat-card"><div class="stat-value" id="verifiedSignals" style="color:var(--green)">—</div><div class="stat-label">已验证</div></div>
      <div class="stat-card"><div class="stat-value" id="pendingSignals" style="color:var(--accent)">—</div><div class="stat-label">待验证</div></div>
      <div class="stat-card"><div class="stat-value" id="hitRate" style="color:var(--yellow)">—</div><div class="stat-label">命中率</div></div>
    </div>

    <div class="section">
      <div class="section-title">按行业分布</div>
      <table>
        <thead><tr><th>行业</th><th>总信号</th><th>已验证</th><th>命中</th><th>落空</th><th>命中率</th></tr></thead>
        <tbody id="industryTable"></tbody>
      </table>
    </div>

    <div class="section">
      <div class="section-title">信号清单（全部）</div>
      <table>
        <thead><tr><th>ID</th><th>行业</th><th>信号</th><th>预测日期</th><th>到期日</th><th>状态</th></tr></thead>
        <tbody id="signalsTable"></tbody>
      </table>
    </div>

    <div class="footer">
      <p>数据来源：<a href="https://lory69060.github.io/cn-intel-board/signal-board-structured.json">signal-board-structured.json</a></p>
      <p>维护脚本：<a href="https://github.com/lory69060/cn-intel-board">GitHub Repo</a> | 最后更新：<span id="updateTime"></span></p>
    </div>
  </div>

  <script>
    async function load() {
      const resp = await fetch('signal-board-structured.json');
      const data = await resp.json();
      const signals = data.signals;
      const tr = data.track_record;

      // Summary
      document.getElementById('totalSignals').textContent = tr.total_signals;
      document.getElementById('verifiedSignals').textContent = tr.verified;
      document.getElementById('pendingSignals').textContent = tr.pending;
      document.getElementById('hitRate').textContent = tr.hit_rate !== null ? (tr.hit_rate * 100).toFixed(0) + '%' : '—';

      // Industry table
      const byIndustry = {};
      signals.forEach(s => {
        if (!byIndustry[s.industry]) byIndustry[s.industry] = { total: 0, verified: 0, hit: 0, miss: 0 };
        byIndustry[s.industry].total++;
        if (s.result === '已兑现' || s.result === '部分兑现' || s.result === '落空') {
          byIndustry[s.industry].verified++;
        }
        if (s.result === '已兑现' || s.result === '部分兑现') byIndustry[s.industry].hit++;
        if (s.result === '落空') byIndustry[s.industry].miss++;
      });

      const indBody = document.getElementById('industryTable');
      for (const [ind, stats] of Object.entries(byIndustry)) {
        const hr = stats.verified > 0 ? (stats.hit / stats.verified).toFixed(0) + '%' : '—';
        indBody.innerHTML += `<tr>
          <td><span class="badge badge-industry">${ind}</span></td>
          <td>${stats.total}</td><td>${stats.verified}</td><td>${stats.hit}</td><td>${stats.miss}</td><td>${hr}</td>
        </tr>`;
      }

      // Signals table
      const sigBody = document.getElementById('signalsTable');
      signals.sort((a, b) => a.verify_by.localeCompare(b.verify_by)).forEach(s => {
        let badgeClass = 'badge-pending';
        let badgeText = '待验证';
        if (s.result === '已兑现') { badgeClass = 'badge-hit'; badgeText = '✅ 已兑现'; }
        else if (s.result === '部分兑现') { badgeClass = 'badge-hit'; badgeText = '🔄 部分兑现'; }
        else if (s.result === '落空') { badgeClass = 'badge-miss'; badgeText = '❌ 落空'; }
        else if (s.result === '推迟') { badgeClass = 'badge-pending'; badgeText = '⏰ 推迟'; }

        sigBody.innerHTML += `<tr>
          <td>#${s.id}</td>
          <td><span class="badge badge-industry">${s.industry}</span></td>
          <td>${s.signal}</td>
          <td>${s.predicted_on}</td>
          <td>${s.verify_by}</td>
          <td><span class="badge ${badgeClass}">${badgeText}</span></td>
        </tr>`;
      });

      document.getElementById('updateTime').textContent = new Date().toLocaleDateString('zh-CN');
    }
    load();
  </script>
</body>
</html>
